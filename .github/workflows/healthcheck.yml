name: Manga Source Health Check

on:
  schedule:
    # 每 12 小时检查一次 (UTC)
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

concurrency:
  group: healthcheck
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run health check
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/healthcheck.py --ci
